[program:website-monitor]
command=python3 -u /workspace/website_monitor.py
directory=/workspace
autostart=true
autorestart=true
startretries=3
startsecs=2
stdout_logfile=/var/log/tool/website-monitor.stdout.log
stderr_logfile=/var/log/tool/website-monitor.stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_backups=3
